<title>Открыть в Claude</title>
<body style="font:17px system-ui;padding:40px 20px;text-align:center">
<p>Открываю сессию в Claude…</p>
<p><a id="a" style="display:block;padding:16px;background:#3445C8;color:#fff;border-radius:12px;text-decoration:none">Открыть в приложении Claude</a></p>

</script>
